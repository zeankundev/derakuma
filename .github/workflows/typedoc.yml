name: Deploy TypeDoc to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow on pushes to main

# Set permissions for GITHUB_TOKEN to allow pushing code to branches
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Documentation
        run: npx typedoc

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs # Pushes the CONTENTS of ./docs to the root of gh-pages
